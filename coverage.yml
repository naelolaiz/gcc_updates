known_gaps:
  - id: 'cxx26-hazard-pointers-and-rcu'
    area: 'C++26 library'
    status: 'unsupported-by-libstdc++-16'
    rationale: 'Track once the required headers ship in the supported toolchain matrix.'
  - id: 'cxx26-execution-senders-receivers'
    area: 'C++26 library'
    status: 'unsupported-by-libstdc++-16'
    rationale: 'Do not conflate std::execution with GCC 16 plugin publish/subscribe support.'
  - id: 'cxx26-hive'
    area: 'C++26 library'
    status: 'unsupported-by-libstdc++-16'
    rationale: 'Keep visible until libstdc++ provides a testable implementation.'
  - id: 'openmp-target-offload'
    area: 'GCC extension'
    status: 'out-of-scope-for-host-only-ci'
    rationale: 'Requires stable accelerator hardware and runtime availability.'
  - id: 'aarch64-std-simd'
    area: 'C++26 library'
    status: 'unsupported-by-libstdc++-16-aarch64'
    rationale: 'libstdc++ 16 ships <simd> for x86 only; cpp26_simd is ARCH x86 until the AArch64 implementation lands.'
  - id: 'aarch64-builtin-cpu-supports'
    area: 'GCC builtin'
    status: 'unsupported-by-gcc-15-aarch64'
    rationale: '__builtin_cpu_init/__builtin_cpu_supports are x86-only; AArch64 runtime dispatch is covered by gccext_target_clones_aarch64 instead.'
  - id: 'target-specific-sanitizers'
    area: 'GCC sanitizer'
    status: 'out-of-scope-for-x86_64-ci'
    rationale: 'ShadowCallStack and memtag need target-specific runners.'
