name: ci

# The default and sanitizer jobs run inside the official `gcc:N` Docker image
# (Debian-based, ships upstream gcc-N + matching upstream libstdc++-N). Build
# environment matches scripts/container-dev.sh so local and CI are bit-identical.
#
# Build is driven by CMake + CTest. See cmake/GccFeature.cmake for the
# gcc_feature_test() function and registration validation.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# `gcc:N` is Debian-based and ships dash as /bin/sh, which doesn't grok
# `set -o pipefail`. Force every step through bash, which gcc:N does ship.
defaults:
  run:
    shell: bash

jobs:
  test:
    # Each GCC version runs on both architectures: amd64 on ubuntu-latest,
    # arm64 on GitHub's free-for-public-repos ubuntu-24.04-arm runners. The
    # official gcc:N images are multi-arch, so the same job body serves both;
    # ARCH-gated examples register only on their matching lane.
    name: gcc-${{ matrix.gcc }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        gcc: [13, 14, 15, 16]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    container:
      image: gcc:${{ matrix.gcc }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install cmake + libtbb
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends cmake libtbb-dev
          g++ --version
          cmake --version
          printf '#include <version>\n' | g++ -x c++ -E -dM - | grep _GLIBCXX_RELEASE || true

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: |
          echo "::group::Compile commands (verbose)"
          cmake --build build --parallel --verbose
          echo "::endgroup::"

      - name: Test
        run: ctest --test-dir build --verbose

  test-clang:
    # Cross-check lane: the same gcc:16 image (so the same pinned upstream
    # libstdc++ 16), with the clang-22 front-end from apt.llvm.org layered on
    # top — only the compiler changes. Proves the portable examples are
    # standard C++ rather than GCC-isms. Mirrors containers/clang.Containerfile;
    # keep the two install recipes in sync.
    name: clang-22 (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    container:
      image: gcc:16
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install cmake + libtbb + clang-22
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends cmake libtbb-dev gnupg
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-22 main" \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update
          apt-get install -y --no-install-recommends clang-22 libomp-22-dev libclang-rt-22-dev
          # Point clang at the image's /usr/local GCC toolchain; its
          # autodetection only scans /usr and would pair with the Debian
          # base's older libstdc++ otherwise.
          echo "--gcc-install-dir=$(ls -d /usr/local/lib/gcc/*/*)" \
            > /usr/lib/llvm-22/bin/clang++.cfg
          clang++-22 --version
          printf '#include <version>\n' | clang++-22 -x c++ -E -dM - | grep "_GLIBCXX_RELEASE " || true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++-22

      - name: Build
        run: |
          echo "::group::Compile commands (verbose)"
          cmake --build build --parallel --verbose
          echo "::endgroup::"

      - name: Test
        run: ctest --test-dir build --verbose

  sanitize-ubsan-asan:
    # Re-build every example with -fsanitize=undefined,address.
    # The REQUIRES_SANITIZER undefined/address/leak demos
    # are enabled here and must fail with their declared report text.
    name: sanitize (gcc-15, ubsan + asan + lsan)
    runs-on: ubuntu-latest
    container:
      image: gcc:15
    env:
      ASAN_OPTIONS: halt_on_error=1:abort_on_error=0:detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      LSAN_OPTIONS: exitcode=1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install cmake + libtbb
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends cmake libtbb-dev

      - name: Configure with -fsanitize=undefined,address
        run: cmake -S . -B build -DGCC_FEATURE_SANITIZE=undefined,address

      - name: Build
        run: |
          echo "::group::Compile commands (verbose)"
          cmake --build build --parallel --verbose
          echo "::endgroup::"

      - name: Test
        run: ctest --test-dir build --verbose

  sanitize-tsan:
    # ThreadSanitizer cannot share a build with ASan -- separate job.
    # Picks up the REQUIRES_SANITIZER thread demos (data race etc.).
    name: sanitize (gcc-15, tsan)
    runs-on: ubuntu-latest
    container:
      image: gcc:15
    env:
      TSAN_OPTIONS: halt_on_error=1:exitcode=66
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install cmake + libtbb
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends cmake libtbb-dev

      - name: Configure with -fsanitize=thread
        run: cmake -S . -B build -DGCC_FEATURE_SANITIZE=thread

      - name: Build
        run: |
          echo "::group::Compile commands (verbose)"
          cmake --build build --parallel --verbose
          echo "::endgroup::"

      - name: Test
        run: ctest --test-dir build --verbose

  sanitize-clang-ubsan-asan:
    # The GCC sanitize lane's proofs against the original compiler-rt
    # runtimes: clang instruments, the same REQUIRES_SANITIZER demos must
    # fail with their declared report text.
    name: sanitize (clang-22, ubsan + asan + lsan)
    runs-on: ubuntu-latest
    container:
      image: gcc:16
    env:
      ASAN_OPTIONS: halt_on_error=1:abort_on_error=0:detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      LSAN_OPTIONS: exitcode=1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install cmake + libtbb + clang-22
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends cmake libtbb-dev gnupg
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-22 main" \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update
          apt-get install -y --no-install-recommends clang-22 libomp-22-dev libclang-rt-22-dev
          echo "--gcc-install-dir=$(ls -d /usr/local/lib/gcc/*/*)" \
            > /usr/lib/llvm-22/bin/clang++.cfg

      - name: Configure with -fsanitize=undefined,address
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++-22 -DGCC_FEATURE_SANITIZE=undefined,address

      - name: Build
        run: |
          echo "::group::Compile commands (verbose)"
          cmake --build build --parallel --verbose
          echo "::endgroup::"

      - name: Test
        run: ctest --test-dir build --verbose

  sanitize-clang-tsan:
    # ThreadSanitizer cannot share a build with ASan -- separate job,
    # mirroring the GCC tsan lane.
    name: sanitize (clang-22, tsan)
    runs-on: ubuntu-latest
    container:
      image: gcc:16
    env:
      TSAN_OPTIONS: halt_on_error=1:exitcode=66
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install cmake + libtbb + clang-22
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends cmake libtbb-dev gnupg
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-22 main" \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update
          apt-get install -y --no-install-recommends clang-22 libomp-22-dev libclang-rt-22-dev
          echo "--gcc-install-dir=$(ls -d /usr/local/lib/gcc/*/*)" \
            > /usr/lib/llvm-22/bin/clang++.cfg

      - name: Configure with -fsanitize=thread
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++-22 -DGCC_FEATURE_SANITIZE=thread

      - name: Build
        run: |
          echo "::group::Compile commands (verbose)"
          cmake --build build --parallel --verbose
          echo "::endgroup::"

      - name: Test
        run: ctest --test-dir build --verbose

  analyze:
    # Compile-time static analyzer. Distinct from runtime sanitizers:
    # -fanalyzer walks paths in the IR and emits -Wanalyzer-* warnings. GCC 16
    # is the first version where it is meaningfully usable on C++ (NRVO +
    # initial exception support). Tests assert the exact -Wanalyzer-* category.
    name: analyze (gcc-16, -fanalyzer)
    runs-on: ubuntu-latest
    container:
      image: gcc:16
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install cmake
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends cmake
          g++ --version
          printf '#include <version>\n' | g++ -x c++ -E -dM - | grep _GLIBCXX_RELEASE || true

      - name: Configure with -fanalyzer
        run: cmake -S . -B build -DGCC_FEATURE_ANALYZER=ON

      - name: Test diagnostics (compile-only)
        run: ctest --test-dir build --verbose
