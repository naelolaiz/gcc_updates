name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: gcc-${{ matrix.gcc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gcc: [13, 14, 15, 16]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install gcc-${{ matrix.gcc }} from toolchain PPA
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y "gcc-${{ matrix.gcc }}" "g++-${{ matrix.gcc }}" libtbb-dev
          sudo update-alternatives --install /usr/bin/gcc gcc \
            "/usr/bin/gcc-${{ matrix.gcc }}" 100
          sudo update-alternatives --install /usr/bin/g++ g++ \
            "/usr/bin/g++-${{ matrix.gcc }}" 100
          g++ --version

      - name: Discover and run examples
        run: python3 scripts/discover.py --gcc-version=${{ matrix.gcc }}

  sanitize-ubsan-asan:
    # Re-run every example under UBSan + ASan on a single GCC version.
    # The 'requires-sanitizer=undefined' / '=address' / '=leak' demo files
    # are enabled here and asserted to abort with their declared exit codes.
    name: sanitize (gcc-15, ubsan + asan + lsan)
    runs-on: ubuntu-latest
    needs: test
    env:
      ASAN_OPTIONS: halt_on_error=1:abort_on_error=0:detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      LSAN_OPTIONS: exitcode=1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install gcc-15 + libtbb
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15 libtbb-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-15 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-15 100
          g++ --version

      - name: Run examples under -fsanitize=undefined,address
        run: python3 scripts/discover.py --gcc-version=15 --sanitize=undefined,address

  sanitize-tsan:
    # ThreadSanitizer cannot share a build with ASan -- separate job.
    # Picks up the 'requires-sanitizer=thread' demo files (data race etc.).
    name: sanitize (gcc-15, tsan)
    runs-on: ubuntu-latest
    needs: test
    env:
      TSAN_OPTIONS: halt_on_error=1:exitcode=66
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install gcc-15 + libtbb
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15 libtbb-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-15 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-15 100
          g++ --version

      - name: Run examples under -fsanitize=thread
        run: python3 scripts/discover.py --gcc-version=15 --sanitize=thread
